name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall backend evaluation
      - name: Lint Python
        run: python -m ruff check backend/app/agents/support_agent.py backend/app/api/routes/agent.py backend/app/api/routes/chat.py backend/app/observability/langsmith.py backend/app/services/llm_service.py backend/app/services/rag_service.py backend/app/schemas/agent.py evaluation/metrics/evaluator.py evaluation/run_evaluation.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Enforce golden dataset quality gates
        run: python -m evaluation.run_evaluation --quality-gate
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  live-evaluation:
    name: Live OpenAI evaluation
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for OpenAI API secret
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped live evaluation
        if: steps.credentials.outputs.available != 'true'
        run: echo "OPENAI_API_KEY is not configured; offline tests passed and live evaluation was skipped."
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -r backend/requirements.txt
      - name: Run live OpenAI smoke tests
        if: steps.credentials.outputs.available == 'true'
        run: python -m pytest backend/tests -q -m live_llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Run DeepEval and RAGAS evaluation
        if: steps.credentials.outputs.available == 'true'
        run: >-
          python -m evaluation.run_evaluation --live --provider both
          --min-deepeval-score 0.7 --min-ragas-score 0.7
          --output evaluation/reports/live-evaluation.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING == 'true' && secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'enterprise-ai-support' }}
      - name: Upload live evaluation report
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-report
          path: evaluation/reports/live-evaluation.json
          if-no-files-found: ignore
