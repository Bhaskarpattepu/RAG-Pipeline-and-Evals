[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-support-backend"
version = "0.1.0"
description = "Enterprise AI Support backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "redis>=5.0.5",
  "httpx>=0.27.2",
  "openai>=1.58.1",
  "langchain>=0.3.3",
  "langchain-openai>=0.3.3",
  "langgraph>=0.2.2",
  "langsmith>=0.14.11",
  "mcp>=1.0.0",
  "qdrant-client>=1.10.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.5.4",
  "mypy>=1.10.0",
  "pytest-asyncio>=0.23.0",
  "deepeval>=1.0.0",
  "langchain-community>=0.3.31,<0.4.0",
  "ragas>=0.4.3,<0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "live_llm: marks tests that call the real OpenAI API",
  "integration: marks tests that require running services",
]

[tool.ruff]
line-length = 100
